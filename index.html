<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentaciones</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1d1d1f; --muted:#5f6368; --line:#e2e0da; --accent:#b4471f;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#16171a; --card:#1f2024; --ink:#ececec; --muted:#a3a6ad; --line:#33353b; --accent:#ef8a5d; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:72px 16px 48px}
header{margin-bottom:48px}
h1{font-size:36px;line-height:1.15;margin:0 0 8px;letter-spacing:-.02em}
header p{color:var(--muted);margin:0}
h2{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 12px}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line)}
li a{display:flex;align-items:baseline;gap:16px;padding:14px 4px;text-decoration:none;color:inherit}
li a:hover .name,li a:focus-visible .name{color:var(--accent)}
li a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.name{font-weight:600}
.meta{color:var(--muted);font-size:14px}
.date{margin-left:auto;color:var(--muted);font-size:14px;white-space:nowrap}
footer{margin-top:64px;color:var(--muted);font-size:13px}
@media (max-width:520px){ li a{flex-wrap:wrap;gap:4px 12px} .date{margin-left:0;width:100%} }
</style>
</head>
<body>
<main>
  <header>
    <h1>Presentaciones</h1>
    <p>Material de apoyo para exposiciones de clase.</p>
  </header>

  <section>
    <h2>Ingeniería del Software · Refactoring</h2>
    <ul>
      <li>
        <a href="./shotgun-surgery.html">
          <span class="name">Shotgun Surgery</span>
          <span class="meta">Code smell · Move Field + Move Method</span>
          <span class="date">Nov 2026</span>
        </a>
      </li>
    </ul>
  </section>

  <footer>Publicado con GitHub Pages</footer>
</main>
</body>
</html>
